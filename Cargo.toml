[package]
name = "lavanda"
version = "1.0.2-dev"
edition = "2021"

[dependencies]
# GUI
iced = { version = "0.13", features = ["image", "canvas", "tokio"] }

# Áudio — decode
symphonia = { version = "0.5", features = ["all"] }

# Áudio — output
cpal = "0.15"

# Tags / metadados
lofty = "0.21"

# MPRIS2 (D-Bus)
mpris-server = "0.8"

# Scanner de diretório
walkdir = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Processamento de imagem (capas de álbum)
image = "0.25"

# Erros ergonômicos
anyhow = "1"

# Configuração
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Gerador de números aleatórios (shuffle)
rand = "0.8"

# FFT (visualizador de espectro)
rustfft = "6"

# Persistência (favorites, playlists, play counts)
serde_json = "1"

# Data/hora (recently played)
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
